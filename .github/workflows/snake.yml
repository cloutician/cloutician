name: Generate contribution snake

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%236F42C1&color_dots=%23ebedf0,%23b6d4fe,%2379b8ff,%233b82f6,%231f6feb
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A78BFA&color_dots=%23161b22,%23183053,%23244c80,%233b82f6,%2379b8ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
